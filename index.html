<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life on Dungeon &mdash; Roda Keberuntungan Kerajaan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>

  <main class="panel">
    <svg class="crown" viewBox="0 0 100 64" aria-hidden="true">
      <defs>
        <linearGradient id="goldG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f3d27c"/>
          <stop offset=".55" stop-color="#d9a94a"/>
          <stop offset="1" stop-color="#8a5c14"/>
        </linearGradient>
      </defs>
      <path d="M10 52 L6 16 L30 34 L50 6 L70 34 L94 16 L90 52 Z" fill="url(#goldG)" stroke="#6e4710" stroke-width="3" stroke-linejoin="round"/>
      <rect x="10" y="50" width="80" height="10" rx="5" fill="url(#goldG)" stroke="#6e4710" stroke-width="3"/>
      <circle cx="50" cy="14" r="5" fill="#f3d27c" stroke="#6e4710" stroke-width="2.5"/>
      <circle cx="6" cy="16" r="4" fill="#f3d27c" stroke="#6e4710" stroke-width="2.5"/>
      <circle cx="94" cy="16" r="4" fill="#f3d27c" stroke="#6e4710" stroke-width="2.5"/>
      <circle cx="26" cy="55" r="3.5" fill="#d8262c" stroke="#6e4710" stroke-width="2"/>
      <circle cx="50" cy="55" r="3.5" fill="#d8262c" stroke="#6e4710" stroke-width="2"/>
      <circle cx="74" cy="55" r="3.5" fill="#d8262c" stroke="#6e4710" stroke-width="2"/>
    </svg>

    <p class="rule-label">The Royal Adventure</p>
    <h1>Life on Dungeon</h1>
    <p class="subtitle">Roda keberuntungan kerajaan &mdash; pilih angka 1 sampai 10</p>

    <div class="content">
      <div class="wheel-wrap">
        <svg class="pointer" viewBox="0 0 52 62" aria-hidden="true">
          <defs>
            <linearGradient id="ptrG" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f3d27c"/>
              <stop offset="1" stop-color="#c8922a"/>
            </linearGradient>
          </defs>
          <path d="M7 5 H45 L26 58 Z" fill="url(#ptrG)" stroke="#6e4710" stroke-width="4" stroke-linejoin="round"/>
        </svg>
        <div class="rim">
          <div class="wheel" id="wheel" role="img" aria-label="Roda berisi angka 1 sampai 10">
            <div class="inner-disc" id="innerDisc" aria-hidden="true"></div>
            <div class="hub" aria-hidden="true"></div>
          </div>
        </div>
      </div>

      <aside class="side-card">
        <div class="rook-row">
          <svg class="flourish" viewBox="0 0 120 40" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
            <path d="M116 20 H78 C64 20 64 8 74 8 C82 8 82 18 72 20 C50 24 30 12 22 20 H4"/>
            <circle cx="60" cy="30" r="2.5" fill="currentColor" stroke="none"/>
          </svg>
          <svg class="rook" viewBox="0 0 40 44" fill="currentColor" aria-hidden="true">
            <path d="M8 4 h5 v5 h4 V4 h6 v5 h4 V4 h5 v10 l-4 4 v18 h4 v4 H8 v-4 h4 V18 l-4 -4 Z"/>
          </svg>
          <svg class="flourish" viewBox="0 0 120 40" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true" style="transform: scaleX(-1)">
            <path d="M116 20 H78 C64 20 64 8 74 8 C82 8 82 18 72 20 C50 24 30 12 22 20 H4"/>
            <circle cx="60" cy="30" r="2.5" fill="currentColor" stroke="none"/>
          </svg>
        </div>

        <h2>Wheel of Life on Dungeon</h2>
        <p class="desc">Putar roda kerajaan untuk menentukan angka petualanganmu. Keberuntungan ada di tanganmu!</p>

        <button class="spin-btn" id="spinBtn">
          <svg viewBox="0 0 100 64" aria-hidden="true"><use href="#crownS"/><path d="M10 52 L6 16 L30 34 L50 6 L70 34 L94 16 L90 52 Z" fill="currentColor" stroke="#4a2c08" stroke-width="4" stroke-linejoin="round"/></svg>
          Putar Spinner
          <svg viewBox="0 0 100 64" aria-hidden="true"><path d="M10 52 L6 16 L30 34 L50 6 L70 34 L94 16 L90 52 Z" fill="currentColor" stroke="#4a2c08" stroke-width="4" stroke-linejoin="round"/></svg>
        </button>

        <hr class="divider">

        <p class="result-label">Angka Terpilih</p>
        <p class="result" id="verdict" role="status" aria-live="polite">Belum diputar</p>
        <p class="hint" id="hint">Tekan tombol untuk memulai</p>
      </aside>
    </div>
  </main>

  <footer class="site-footer"><span class="diamond">&#9670;</span> LIFE ON DUNGEON <span class="diamond">&#9670;</span></footer>

  <script src="script.js"></script>
</body>
</html>
